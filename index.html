<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALEX · SHADOW OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <section class="card" id="card">
    <header class="bio">
      <div class="ring">
        <svg viewBox="0 0 90 90" aria-hidden="true">
          <circle class="ring-track" cx="45" cy="45" r="43"/>
          <circle class="ring-arc" id="ringArc" cx="45" cy="45" r="43"/>
        </svg>
        <div class="ring-core">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.8-3.6 3.4-5.4 6.5-5.4s5.7 1.8 6.5 5.4"/></svg>
        </div>
      </div>
      <div class="bio-info">
        <div class="bio-row"><span>BIOMETRIC SYNC</span><span id="bioPct">0%</span></div>
        <div class="bar"><i id="bioBar"></i></div>
        <div class="bio-row"><span class="live"><b class="dot"></b>LIVE</span><span class="clock" id="clock">00:00:00</span></div>
      </div>
    </header>

    <div class="title">
      <h1 id="glitch" data-text="ALEX">ALEX</h1>
      <p>SHADOW OS</p>
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <label for="uid">ACCESS ID</label>
      <div class="field"><input id="uid" type="text" placeholder="enter id" autocapitalize="off" autocorrect="off" spellcheck="false"></div>

      <label for="pass">PASSKEY</label>
      <div class="field">
        <input id="pass" type="password" placeholder="enter passkey" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="eye" id="eye" aria-label="Show passkey">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><line id="eyeSlash" x1="3" y1="3" x2="21" y2="21" style="display:none"/></svg>
        </button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"><b class="dot"></b><span id="statusText">ENCRYPTED</span></div>

      <button type="submit" class="auth" id="auth"><span>AUTHENTICATE</span></button>
    </form>

    <footer>
      <p>ALEX SYSTEM · SHADOW OS</p>
      <p>DEVELOPED BY <em>GODSAN</em></p>
    </footer>
  </section>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
