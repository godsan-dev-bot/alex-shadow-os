<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Vault · ALEX SHADOW OS</title>
<script>try{if(!sessionStorage.getItem('alex_session'))location.replace('index.html')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="vault.css">
</head>
<body data-page="vault" data-top="terminal" data-title="My Vault">
<div class="app">
  <div id="sideSlot"></div>
  <div class="main">
    <div id="topSlot"></div>

    <main class="content vpage">
      <div class="vhead">
        <div>
          <h1 class="vtitle">MY VAULT</h1>
          <p class="vsub" id="vCount">0 passwords stored</p>
        </div>
        <div class="vacts">
          <button class="bt fill" id="bAdd"><span data-i="plus2"></span>Add Password</button>
          <button class="bt" id="bImp"><span data-i="upload"></span>Import</button>
          <button class="bt" id="bExp"><span data-i="download"></span>Export</button>
          <input type="file" id="fileIn" accept=".json,.csv,application/json,text/csv" hidden>
        </div>
      </div>

      <section class="card vbox">
        <div class="vtools">
          <label class="vsearch"><span data-i="search"></span><input id="vq" type="search" placeholder="Search passwords..." autocomplete="off"></label>
          <select id="fType" aria-label="Filter by strength">
            <option value="all">All passwords</option><option value="weak">Weak</option><option value="strong">Strong</option><option value="reused">Reused</option>
          </select>
          <select id="fCat" aria-label="Filter by category"></select>
          <select id="fSort" aria-label="Sort">
            <option value="new">Newest</option><option value="old">Oldest</option><option value="az">A – Z</option><option value="za">Z – A</option><option value="weak">Weakest first</option>
          </select>
        </div>

        <div id="vrows" class="vrows"></div>

        <div class="vfoot">
          <span id="vShow">Showing 0 entries</span>
          <div class="pager" id="pager"></div>
        </div>
      </section>
    </main>

    <div id="footSlot"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="vault.js"></script>
</body>
</html>
